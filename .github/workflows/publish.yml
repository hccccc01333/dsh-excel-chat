# Publish dsh-excel-chat to npm and attach the tarball to a GitHub Release.
#
# Publishing uses npm **trusted publishing** (OIDC): GitHub mints a short-lived
# token for this exact workflow, so there is no `NPM_TOKEN` secret to rotate, no
# long-lived credential in the repo, and no 2FA prompt to sit through. It also
# makes a release fully automatic — `node scripts/release.mjs X.Y.Z` is the whole
# procedure.
#
# One-time setup (repo owner), on npmjs.com:
#   Package → Settings → Trusted publishing → GitHub Actions
#     Organization or user : hccccc01333
#     Repository           : dsh-excel-chat
#     Workflow filename    : publish.yml        (the file name only)
#     Environment name     : (leave blank)
#     Allowed actions      : allow `npm publish` — leaving only `npm stage
#                            publish` checked sends every release back to a
#                            manual 2FA approval
#   Every field is case-sensitive and npm does not validate them on save: a typo
#   only surfaces as ENEEDAUTH on the next release. The configuration must also
#   complete one successful publish within two days or it expires.
#
# Trigger a release:
#   node scripts/release.mjs X.Y.Z
# which bumps both manifests, stamps CHANGELOG.md, commits, tags and pushes; this
# workflow then tests, builds, publishes and opens the GitHub Release.

name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to npm (must run from a v* tag). Leave unchecked for a dry-run pack.'
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'

jobs:
  pack:
    name: Test, build and pack tarball
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install (immutable)
        run: npm ci

      - name: Verify release version
        run: |
          pkg_version=$(node -p "require('./bundle/package.json').version")
          echo "bundle version: $pkg_version"
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [[ "$tag_version" != "$pkg_version" ]]; then
              echo "::error::tag v$tag_version does not match bundle version $pkg_version" >&2
              exit 1
            fi
          fi
          echo "PKG_VERSION=$pkg_version" >> "$GITHUB_ENV"

      - name: Test
        run: node --test tests/*.test.ts

      - name: Build bundle
        run: npm run build:bundle

      - name: Pack tarball
        run: |
          mkdir -p dist
          cd bundle
          npm pack --pack-destination ../dist

      - name: Show tarball contents
        run: tar -tzf dist/*.tgz

      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    if: github.event_name == 'push' || inputs.publish
    needs: pack
    runs-on: ubuntu-24.04
    concurrency:
      group: Release-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          # A release build must never restore a cached tree.
          package-manager-cache: false

      - uses: actions/download-artifact@v4
        with:
          name: npm-tarball
          path: dist

      # No NODE_AUTH_TOKEN: setting one would force token auth and defeat OIDC.
      # Provenance is generated automatically for an OIDC publish from a public
      # repository, so `--provenance` is not passed either.
      - name: Publish tarball
        run: npm publish ./dist/*.tgz --access public

  release:
    name: GitHub Release with tarball
    if: github.event_name == 'push'
    needs: pack
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-tarball
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tgz
          generate_release_notes: true
