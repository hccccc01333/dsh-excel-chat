# Run the test suite on every branch push and pull request.
#
# publish.yml runs the same suite, but only when a v* tag is pushed — this
# workflow guards day-to-day commits so a regression cannot sit on master
# unnoticed until the next release.
name: Test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  test:
    name: Test (${{ matrix.os }})
    # Windows is not decoration. The plugin writes files, renames over them and compares
    # paths, and every one of those behaves differently there — case-insensitive
    # filesystems, backslash separators, rename-over-an-open-file. Issue #5's silent skip
    # was a packaging problem, but a path problem would be just as invisible from Linux.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # No `git config core.autocrlf false` here. It cannot work: every step runs after
      # the checkout, so by the time it executes the conversion has already happened. Line
      # endings are pinned in .gitattributes, which git reads at checkout time — that is
      # the only place the setting takes effect, and it is why the rebuild check below is
      # stable on Windows.
      - name: Install (immutable)
        run: npm ci

      - name: Type check
        run: npx tsc -p bundle/tsconfig.json --noEmit

      - name: Rebuild the bundle
        run: npm run build:bundle

      # `bundle/dist` is committed because it is what users install. If the source
      # changed and the bundle did not, the tests below would pass against a stale
      # artifact and the release would ship code nobody tested.
      - name: The committed bundle matches the source
        run: git diff --exit-code -- bundle/dist

      - name: Test
        run: node --test tests/*.test.ts

      - name: Pack (dry run)
        working-directory: bundle
        run: npm pack --dry-run
